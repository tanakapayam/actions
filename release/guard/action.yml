name: Release guard
description: >-
  Check that a GitHub Release is ready to publish: the tag is the prefix plus the version the
  code declares, and the changelog has an entry for that version that is not still marked
  Unreleased.

inputs:
  tag-prefix:
    description: The tag prefix, such as `python-v` (a release tag is the prefix plus the version).
    required: true
  version:
    description: >-
      The version the code declares, read by an earlier step of your own (a one-liner on
      `__version__`, `package.json`, ...). An empty value fails the guard.
    required: true
  changelog:
    description: Path to the changelog, relative to the workspace.
    default: CHANGELOG.md
  tag:
    description: The release tag to check. Defaults to the tag of the release that triggered the run.
    default: ${{ github.event.release.tag_name }}
  require-date:
    description: >-
      `true` to require the heading to carry an ISO date, `## [1.2.3] - 2026-10-04`, rather than
      merely not say Unreleased.
    default: "false"

runs:
  using: composite
  steps:
    - name: Check the release is ready
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        TAG: ${{ inputs.tag }}
        PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog }}
        REQUIRE_DATE: ${{ inputs.require-date }}
      run: |
        args=(--tag "$TAG" --prefix "$PREFIX" --version "$VERSION" --changelog "$CHANGELOG")
        if [ "$REQUIRE_DATE" = "true" ]; then args+=(--require-date); fi
        python3 "$ACTION_PATH/../../lib/guard.py" "${args[@]}"
